# All workspaces but the first two default to either external monitor.
workspace 1  output eDP-1
workspace 2  output eDP-1
workspace 3  output DP-1 DP-2 DP-3 DP-4 eDP-1
workspace 4  output DP-1 DP-2 DP-3 DP-4 eDP-1
workspace 5  output DP-1 DP-2 DP-3 DP-4 eDP-1
workspace 6  output DP-1 DP-2 DP-3 DP-4 eDP-1
workspace 7  output DP-1 DP-2 DP-3 DP-4 eDP-1
workspace 8  output DP-1 DP-2 DP-3 DP-4 eDP-1
workspace 9  output DP-1 DP-2 DP-3 DP-4 eDP-1
workspace 10 output DP-1 DP-2 DP-3 DP-4 eDP-1

# App positions.
assign [app_id="org.mozilla.thunderbird"] workspace 3
assign [app_id="discord"] workspace 5
assign [app_id="org.telegram.desktop"] workspace 6
assign [app_id="com.slack.Slack"] workspace 7
assign [class="Slack"] workspace 7
assign [app_id="org.mozilla.firefox"] workspace 8
assign [app_id="chromium"] workspace 9
assign [app_id="nnn"] workspace 9
assign [app_id="org.strawberrymusicplayer.strawberry"] workspace 10

for_window [app_id="^menu$"] floating enable, border none
# TODO: this doesn't work. use the geometry?
for_window [app_id="^firefox$" title="^Extension: \(Bitwarden - Free Password Manager\)"] floating enable
for_window [floating] border csd
for_window [shell="xwayland"] title_format "[XWayland] %title"
