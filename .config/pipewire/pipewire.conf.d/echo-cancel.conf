# Wired headsets leak playback into the mic over the shared jack ground.
# Cancel everything sent to the default sink, not just the call's own audio.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            capture.props = {
                node.name = "echo-cancel-capture"
                node.passive = true
            }
            source.props = {
                node.name = "echo-cancel-source"
                node.description = "Echo-cancelled mic"
            }
        }
    }
]
